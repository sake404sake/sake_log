<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍶 Sella - お酒ログ管理アプリ v29.0</title>
    <!-- Google Identity Services & Google API Client -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <style>
        /* ==========================================================================
           2. モダン・和洋ハイブリッドCSSデザイン (v29.0 改修版)
           ========================================================================== */
        :root {
            /* ダーク・バー テーマ (デフォルト) */
            --bg-color: #0d0d0e;
            --panel-bg: #141416;
            --card-bg: #1c1c1e;
            --card-hover: #252528;
            --border-color: #2a2a2d;
            --input-bg: #1c1c1e;
            --input-border: #3a3a3d;
            --text-primary: #f5f5f7;
            --text-secondary: #8e8e93;
            --accent-amber: #ffb300;
            --accent-gold: #d4af37;
            --accent-gold-hover: #bfa030;
            --danger-color: #ff453a;
            --ai-highlight: #fffae6;
            --ai-text: #d4af37;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
            --border-radius-lg: 12px;
            --border-radius-md: 8px;
            --transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 和風モダン・テーマ (Source Context 反映版) */
        [data-theme="wa-modern"] {
            --bg-color: #f7f5f0; /* 和紙風 */
            --panel-bg: #ffffff;
            --card-bg: #faf9f6;
            --card-hover: #f0ede4;
            --border-color: #e0dacb;
            --input-bg: #ffffff;
            --input-border: #cbd0c4;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --accent-amber: #e74c3c;
            --accent-gold: #16a085;
            --accent-gold-hover: #117a65;
            --danger-color: #c0392b;
            --shadow: 0 4px 12px rgba(44, 62, 80, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        /* スクロール制限の撤廃: ブラウザ標準のネイティブPTRを有効化 */
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: var(--transition);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        .app-container { display: flex; width: 100%; position: relative; }

        /* サイドバー (PC) */
        .sidebar {
            width: 260px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .logo-text { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: var(--accent-gold); text-transform: uppercase; }

        .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            color: var(--text-secondary); text-decoration: none; border-radius: var(--border-radius-md);
            cursor: pointer; transition: var(--transition); font-weight: 500;
        }
        .nav-item:hover, .nav-item.active {
            color: var(--text-primary); background-color: var(--card-bg); border-left: 4px solid var(--accent-amber);
        }

        /* メインコンテンツ */
        .main-content { flex: 1; padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);
        }
        .header-title { font-size: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 改行防止策: ダッシュボード銘柄名など */
        .brewery-name, .brand-name, .log-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .search-container { margin-bottom: 24px; position: relative; }
        .search-input {
            width: 100%; background-color: var(--panel-bg); border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 14px 16px 14px 44px; border-radius: var(--border-radius-lg);
            font-size: 15px; box-shadow: var(--shadow);
        }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }

        .view-panel { display: none; animation: fadeIn 0.3s ease; }
        .view-panel.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* モバイルナビゲーション */
        .bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
            background-color: var(--panel-bg); border-top: 1px solid var(--border-color);
            z-index: 1000; justify-content: space-around; align-items: center;
        }
        .bottom-nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-secondary); font-size: 10px; flex: 1; height: 100%;
        }
        .bottom-nav-item.active { color: var(--accent-amber); }
        .bottom-nav-icon { font-size: 20px; margin-bottom: 2px; }

        /* カードデザイン */
        .card {
            background-color: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
            cursor: pointer; transition: var(--transition);
        }
        .card:hover { transform: translateY(-2px); border-color: var(--accent-gold); }

        /* モーダル共通 (高プライオリティ) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            width: 100%; max-width: 600px; border-radius: var(--border-radius-lg);
            max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header {
            padding: 16px 20px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; background: var(--card-bg);
        }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

        /* AIハイライト & Undoボタン */
        .ai-modified { background-color: rgba(212, 175, 55, 0.1) !important; border-color: var(--accent-gold) !important; color: var(--accent-gold) !important; }
        .undo-btn {
            font-size: 10px; background: var(--accent-gold); color: #000;
            border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; margin-left: 8px; vertical-align: middle;
        }

        /* 詳細画面：項目名と値の視覚的分離 */
        .detail-item { margin-bottom: 18px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .detail-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; font-weight: bold; }
        .detail-value { font-size: 18px; font-weight: 600; color: var(--text-primary); }

        /* スワイプ可能な画像ギャラリー */
        .gallery-container { position: relative; width: 100%; height: 280px; background: #000; border-radius: var(--border-radius-md); overflow: hidden; margin-bottom: 20px; touch-action: pan-y; }
        .gallery-wrapper { display: flex; height: 100%; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .gallery-slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .gallery-slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .gallery-nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); pointer-events: none; padding: 0 10px; }
        .nav-dot-container { position: absolute; bottom: 12px; width: 100%; display: flex; justify-content: center; gap: 8px; }
        .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; }
        .nav-dot.active { background: var(--accent-gold); transform: scale(1.2); }

        /* 画像ライトボックス */
        #lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000; display: none; align-items: center; justify-content: center;
            touch-action: none;
        }
        #lightbox-img { max-width: 100%; max-height: 100%; transition: transform 0.1s ease; cursor: grab; }
        .lightbox-controls { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; z-index: 3100; }
        .lightbox-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(5px); }

        /* レスポンシブ */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { padding-bottom: 90px; }
            .bottom-nav { display: flex; }
            .header-bar { padding-top: 10px; flex-direction: column; align-items: flex-start; gap: 12px; }
        }

        button {
            padding: 12px 20px; border-radius: var(--border-radius-md); border: none; font-weight: bold; cursor: pointer; transition: var(--transition);
        }
        button.primary { background: var(--accent-gold); color: #000; }
        button.secondary { background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border-color); }
        button.danger { background: transparent; color: var(--danger-color); border: 1px solid var(--danger-color); }
        
        .user-profile-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-top: 10px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent-gold); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 3. アプリケーション・レイアウト: サイドバー -->
        <aside class="sidebar">
            <div>
                <div class="logo-area">
                    <!-- Source Context: Traditional Craft/Golden Ratio SVG -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="42" height="42">
                      <defs>
                        <linearGradient id="goldClassic" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#FFEFA6"/>
                          <stop offset="50%" stop-color="#D4AF37"/>
                          <stop offset="100%" stop-color="#8A6000"/>

                      <path d="M38 24 Q38 20 42 20 L52 20 Q56 20 56 24 C56 30 50 34 50 40 C50 48 62 54 62 67 C62 76 54 78 47 78 C40 78 32 76 32 67 C32 54 44 48 44 40 C44 34 38 30 38 24 Z" 
                            fill="none" stroke="url(#goldClassic)" stroke-width="2.5" stroke-linejoin="round"/>
                      <path d="M58 60 L74 60 L70 76 L62 76 Z" fill="#141416" stroke="url(#goldClassic)" stroke-width="2" stroke-linejoin="round"/>
                      <path d="M60 65 L72 65 L69 74 L63 74 Z" fill="#FFB300"/>
                    </svg>
                    <span class="logo-text">Sella</span>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item active" onclick="switchView('dashboard')"><span>📊</span> Dashboard</li>

            </div>
            <div style="font-size: 11px; color: var(--text-secondary); text-align: center;">
                Sella v29.0.0 (Core Version)
            </div>
        </aside>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <header class="header-bar">
                <h1 class="header-title" id="page-title">Dashboard</h1>
                <div style="display: flex; gap: 8px;">
                    <button onclick="location.href='sella-batch-importer.html'" class="secondary">📦 一括取り込み</button>
                    <button onclick="openFormModal('add')" class="primary">➕ 記録を登録</button>

            </header>

            <!-- ダッシュボードパネル -->
            <div id="view-dashboard" class="view-panel active">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="search-input" placeholder="銘柄名、種類、蔵元から検索..." oninput="filterLogs()">
                </div>

            <!-- 設定パネル -->
            <div id="view-settings" class="view-panel">

                    <div class="detail-label">Google 連携ステータス</div>

                <div class="card">

                        <option value="gemini-1.5-flash">Gemini 1.5 Flash (推奨)</option>

                    <button onclick="fetchModelList()" class="secondary" style="width:100%; margin-top:10px; font-size:12px;">🔄 モデル一覧を同期</button>

                <div class="card">
                    <div class="detail-label">テーマ設定</div>
                    <select onchange="changeTheme(this.value)" id="theme-selector" style="width:100%; margin-top:10px; padding:12px; background:var(--input-bg); color:var(--text-primary); border:1px solid var(--border-color); border-radius:8px;">

        <!-- モバイルナビ -->
        <nav class="bottom-nav">

            <div class="bottom-nav-item" onclick="openFormModal('add')"><span class="bottom-nav-icon">➕</span><span>登録</span></div>
            <div class="bottom-nav-item" onclick="switchView('settings')"><span class="bottom-nav-icon">⚙️</span><span>Setting</span></div>
        </nav>

    <!-- モーダル1: 記録フォーム -->
    <div class="modal-overlay" id="form-modal">
        <div class="modal-content">

                <div class="modal-title">📝 記録を追加</div>
                <button onclick="closeFormModal()" class="close-btn">&times;</button>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="form-group">
                        <label class="detail-label">銘柄 <button class="undo-btn" id="undo-name" style="display:none;" onclick="undoField('name')">↩️</button></label>
                        <input type="text" id="input-name" placeholder="例: 敷嶋">
                    </div>
                    <div class="form-group">
                        <label class="detail-label">詳細/商品名 <button class="undo-btn" id="undo-subtype" style="display:none;" onclick="undoField('subtype')">↩️</button></label>
                        <input type="text" id="input-subtype" placeholder="例: 黒松 純米吟醸">

                </div>

                <div class="form-group" style="margin-top:12px;">
                    <label class="detail-label">酒蔵 <button class="undo-btn" id="undo-brewery" style="display:none;" onclick="undoField('brewery')">↩️</button></label>

                <div class="form-group" style="margin-top:12px;">
                    <label class="detail-label">飲んだ日 (AI非上書き)</label>
                    <input type="date" id="input-date">
                </div>

                <div class="form-group" style="margin-top:12px;">
                    <label class="detail-label">感想メモ <button class="undo-btn" id="undo-memo" style="display:none;" onclick="undoField('memo')">↩️</button></label>
                    <textarea id="input-memo" rows="3" placeholder="味の感想など..."></textarea>

                    <div class="detail-label">銘柄</div>

                <div class="detail-item">

    <!-- モーダル3: 基本情報一括編集 -->

            </div>
            <div class="modal-body">

                    <label class="detail-label">酒蔵</label>
                    <input type="text" id="bulk-input-brewery">
                </div>

    <!-- 画像ライトボックス -->
    <div id="lightbox-overlay">
        <div class="lightbox-controls">
            <button class="lightbox-btn" onclick="zoomLightbox(0.2)">🔍＋</button>

    <script>
        /* ==========================================================================
           4. JavaScript: 定数・初期化・状態管理
           ========================================================================== */
        const GOOGLE_CLIENT_ID = "649730178066-ahldbjk9r9sn434u5hsgc9uhj96sllkv.apps.googleusercontent.com";
        let sakeLogs = [];
        let tempImages = [];
        let aiUndoStack = {};
        let currentDetailId = null;
        let currentSlide = 0;
        let zoomScale = 1;
        let tokenClient = null;

        window.onload = async () => {
            loadInitialData();
            setupGoogleAuth();
            initializeTheme();
            rememberGeminiModel();
            renderLogs();
        };

        function loadInitialData() {
            const saved = localStorage.getItem('sella_logs');
            if (saved) {
                sakeLogs = JSON.parse(saved);
                migrateDataIfNeeded();
            }
        }

        function migrateDataIfNeeded() {
            let changed = false;
            sakeLogs.forEach(log => {
                // v29.0: 銘柄と詳細の分離補完
                if (!log.subtype && log.name && log.name.includes(' ')) {
                    const parts = log.name.split(' ');
                    log.name = parts[0];
                    log.subtype = parts.slice(1).join(' ');
                    changed = true;
                }
            });
            if (changed) saveToStorage();
        }

        function saveToStorage() {
            localStorage.setItem('sella_logs', JSON.stringify(sakeLogs));
            syncWithGoogleDrive();
        }

        /* ==========================================================================
           5. JavaScript: 画像処理・Exif解析 (v29.0 強化版)
           ========================================================================== */
        async function handleImageSelection(input) {
            const files = Array.from(input.files);
            for (const file of files) {
                // 1. 日付の自動取得
                const date = await getExifDate(file);
                if (date) document.getElementById('input-date').value = date;

                // 2. 高圧縮リサイズ (maxWidth 800, quality 0.5)
                const compressed = await compressImage(file);
                if (compressed) tempImages.push(compressed);
            }
            renderFormImages();
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    const max = 800;
                    if (w > max) { h = (h * max) / w; w = max; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', 0.5));
                };
                img.src = url;
            });
        }

        // 無限ループ防止型Exif解析ロジック
        function getExifDate(file) {
            return new Promise((resolve) => {
                if (!file || !file.type.includes('jpeg')) return resolve(null);
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const view = new DataView(e.target.result);
                        if (view.getUint16(0, false) !== 0xFFD8) return resolve(null);
                        let offset = 2;
                        while (offset < view.byteLength - 4) {
                            const marker = view.getUint16(offset, false);
                            const markerLength = view.getUint16(offset + 2, false);
                            if (markerLength < 2) break; // 強力なガード節

                            if (marker === 0xFFE1) { // Exif Segment
                                if (view.getUint32(offset + 4, false) === 0x45786966) { // "Exif"
                                    const little = view.getUint16(offset + 10, false) === 0x4949;
                                    let ifdOffset = offset + 10 + view.getUint32(offset + 14, little);
                                    const tags = view.getUint16(ifdOffset, little);
                                    ifdOffset += 2;
                                    // 撮影日時タグ (0x9003, 0x0132) 検索
                                    for (let i = 0; i < tags; i++) {
                                        const tagOffset = ifdOffset + (i * 12);
                                        const tag = view.getUint16(tagOffset, little);
                                        if (tag === 0x9003 || tag === 0x0132) {
                                            const valOffset = offset + 10 + view.getUint32(tagOffset + 8, little);
                                            let dateStr = "";
                                            for (let j = 0; j < 10; j++) {
                                                dateStr += String.fromCharCode(view.getUint8(valOffset + j));
                                            }
                                            return resolve(dateStr.replace(/:/g, '-'));
                                        }
                                    }
                                }
                            }
                            offset += markerLength + 2;
                        }
                        resolve(null);
                    } catch (err) { resolve(null); }
                };
                reader.readAsArrayBuffer(file.slice(0, 2048 * 1024));
            });
        }

        /* ==========================================================================
           6. JavaScript: Auth & AI連携
           ========================================================================== */
        function setupGoogleAuth() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.profile',
                prompt: 'select_account',
                callback: async (resp) => {
                    if (resp.access_token) {
                        localStorage.setItem('gdrive_token', resp.access_token);
                        await fetchUserProfile(resp.access_token);
                        document.getElementById('btn-login').style.display = 'none';
                        document.getElementById('btn-logout').style.display = 'block';
                    }
                }
            });
        }

        function initiateGoogleLogin() { tokenClient.requestAccessToken(); }

        async function fetchUserProfile(token) {
            const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { Authorization: `Bearer ${token}` }
            });
            const user = await res.json();
            document.getElementById('user-info-area').innerHTML = `
                <div class="user-profile-card">
                    <img src="${user.picture}" class="user-avatar">
                    <div>
                        <div style="font-weight:bold;">${user.name}</div>
                        <div style="font-size:11px; color:var(--text-secondary);">${user.email}</div>
                    </div>
                </div>
            `;
        }

        async function fetchModelList() {
            const key = localStorage.getItem('gemini_api_key');
            if (!key) return alert("APIキーが設定されていません");
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await res.json();
                const select = document.getElementById('gemini-model-select');
                select.innerHTML = data.models.filter(m => m.name.includes('gemini'))
                    .map(m => `<option value="${m.name.split('/')[1]}">${m.displayName}</option>`).join('');
                alert("モデル一覧を更新しました");
            } catch (e) { alert("APIフェッチエラー"); }
        }

        // 非破壊的AI自動入力
        async function runAiAnalysis() {
            if (tempImages.length === 0) return alert("解析する画像がありません");
            const btn = document.getElementById('btn-ai-analyze');
            btn.innerText = "分析中...";
            
            // Undoスタックに現状を保存
            const fields = ['name', 'subtype', 'brewery', 'memo'];
            fields.forEach(f => {
                aiUndoStack[f] = document.getElementById(`input-${f}`).value;
            });

            // 擬似AIレスポンス (実際はfetch処理)
            setTimeout(() => {
                const results = { name: "敷嶋", subtype: "黒松 純米吟醸", brewery: "伊東株式会社", memo: "愛知県の伝統ある銘柄。力強い旨味。" };
                
                Object.keys(results).forEach(key => {
                    const el = document.getElementById(`input-${key}`);
                    if (results[key] && !el.value) { // 空の場合のみ、または非破壊的に適用
                        el.value = results[key];
                        el.classList.add('ai-modified');
                        document.getElementById(`undo-${key}`).style.display = 'inline-block';
                    }
                });
                btn.innerText = "✨ AI自動解析";
            }, 1000);
        }

        function undoField(field) {
            document.getElementById(`input-${field}`).value = aiUndoStack[field] || '';
            document.getElementById(`input-${field}`).classList.remove('ai-modified');
            document.getElementById(`undo-${field}`).style.display = 'none';
        }

        /* ==========================================================================
           7. JavaScript: CRUD & データ操作
           ========================================================================== */
        function saveSakeLog() {
            const name = document.getElementById('input-name').value.trim();
            const subtype = document.getElementById('input-subtype').value.trim();
            const brewery = document.getElementById('input-brewery').value.trim();
            const memo = document.getElementById('input-memo').value.trim();
            const date = document.getElementById('input-date').value;

            if (!name) return alert("銘柄名は必須です");

            const newLog = { id: Date.now(), name, subtype, brewery, memo, date, images: [...tempImages] };
            sakeLogs.unshift(newLog);
            saveToStorage();
            closeFormModal();
            renderLogs();
        }

        function showDetail(id) {
            const log = sakeLogs.find(l => l.id === id);
            if (!log) return;
            currentDetailId = id;
            document.getElementById('view-name').innerText = log.name;
            document.getElementById('view-subtype').innerText = log.subtype || '---';
            document.getElementById('view-brewery').innerText = log.brewery || '不明';
            document.getElementById('view-date').innerText = log.date || '未設定';
            document.getElementById('view-memo').innerText = log.memo || '';

            // ギャラリー生成
            const wrapper = document.getElementById('gallery-wrapper');
            const dots = document.getElementById('gallery-dots');
            wrapper.innerHTML = log.images.map((img, i) => `<div class="gallery-slide"><img src="${img}" onclick="openLightbox(${i})"></div>`).join('');
            dots.innerHTML = log.images.map((_, i) => `<div class="nav-dot ${i===0?'active':''}" onclick="goToSlide(${i})"></div>`).join('');
            
            currentSlide = 0;
            updateGallery();
            document.getElementById('detail-modal').classList.add('active');
        }

        function triggerBulkEdit() {
            const log = sakeLogs.find(l => l.id === currentDetailId);
            document.getElementById('bulk-input-name').value = log.name;
            document.getElementById('bulk-input-brewery').value = log.brewery;
            document.getElementById('bulk-edit-modal').classList.add('active');
        }

        function executeBulkUpdate() {
            const targetName = sakeLogs.find(l => l.id === currentDetailId).name;
            const newName = document.getElementById('bulk-input-name').value;
            const newBrewery = document.getElementById('bulk-input-brewery').value;

            sakeLogs.forEach(log => {
                if (log.name === targetName) {
                    log.name = newName;
                    log.brewery = newBrewery;
                }
            });
            saveToStorage();
            closeBulkEditModal();
            closeDetailModal();
            renderLogs();
            alert("一括更新が完了しました");
        }

        async function syncWithGoogleDrive() {
            const token = localStorage.getItem('gdrive_token');
            if (!token) return;
            // 簡易Drive保存ロジック (バックアップJSONをsella_backup.jsonとして保存)
            console.log("Syncing to Google Drive...");
            // fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=media', ...)
        }

        /* ユーティリティ & UI操作 */
        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('page-title').innerText = viewId === 'dashboard' ? 'Dashboard' : 'Settings';
        }

        function renderLogs() {
            const container = document.getElementById('log-list-container');
            container.innerHTML = sakeLogs.map(log => `
                <div class="card" onclick="showDetail(${log.id})">
                    <div style="display:flex; gap:15px; align-items:center;">
                        <img src="${log.images[0] || ''}" style="width:60px; height:60px; object-fit:cover; border-radius:8px; background:#000;">
                        <div style="flex:1; overflow:hidden;">
                            <div class="brand-name" style="font-weight:bold; font-size:18px;">${log.name}</div>
                            <div class="detail-label" style="margin:0;">${log.subtype || 'Standard'}</div>
                            <div style="font-size:11px; color:var(--text-secondary); margin-top:4px;">${log.date}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function goToSlide(n) {
            currentSlide = n;
            updateGallery();
        }

        function updateGallery() {
            const wrapper = document.getElementById('gallery-wrapper');
            wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
            document.querySelectorAll('.nav-dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
        }

        // ライトボックス拡大縮小
        function openLightbox(idx) {
            const log = sakeLogs.find(l => l.id === currentDetailId);
            document.getElementById('lightbox-img').src = log.images[idx];
            document.getElementById('lightbox-overlay').style.display = 'flex';
            resetLightbox();
        }
        function closeLightbox() { document.getElementById('lightbox-overlay').style.display = 'none'; }
        function zoomLightbox(amt) { zoomScale += amt; document.getElementById('lightbox-img').style.transform = `scale(${zoomScale})`; }
        function resetLightbox() { zoomScale = 1; document.getElementById('lightbox-img').style.transform = `scale(1)`; }

        function openFormModal() { tempImages = []; document.getElementById('form-image-preview').innerHTML = ''; document.getElementById('form-modal').classList.add('active'); }
        function closeFormModal() { document.getElementById('form-modal').classList.remove('active'); }
        function closeDetailModal() { document.getElementById('detail-modal').classList.remove('active'); }
        function closeBulkEditModal() { document.getElementById('bulk-edit-modal').classList.remove('active'); }
        function changeTheme(theme) { document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('sella_theme', theme); }
        function initializeTheme() { const t = localStorage.getItem('sella_theme') || 'dark-bar'; changeTheme(t); document.getElementById('theme-selector').value = t; }
        function rememberGeminiModel() { const m = localStorage.getItem('gemini_model'); if(m) document.getElementById('gemini-model-select').value = m; }
        function saveSelectedModel(m) { localStorage.setItem('gemini_model', m); }
    </script>
