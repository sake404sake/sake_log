<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sella - お酒試飲ログ</title>
  
  <!-- アプリケーションスタイルシート -->
  <link rel="stylesheet" href="src/style.css">
  
  <!-- 🌟 ブラウザのタブ用標準ファビコン -->
  <link rel="icon" type="image/png" href="src/icons/favicon.png" sizes="32x32">
  <link rel="icon" type="image/png" href="src/icons/icon-192.png" sizes="192x192">

  <!-- 🌟 iOS (Safari) ホーム画面アイコン（Web Clip）用の絶対指定 -->
  <link rel="apple-touch-icon" href="src/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="src/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="src/icons/apple-touch-icon.png">

  <!-- 🌟 iOS Safari でのネイティブPWA立ち上げ（全画面）を可能にする特殊メタタグ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sella">
  <meta name="theme-color" content="#121316">

  <!-- 🌟 Android / PWA対応マニフェストへのリンク -->
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="app-container">
    <!-- 背景オーバーレイ（モバイルドロワー用） -->
    <div class="drawer-overlay" id="drawer-overlay"></div>

    <!-- 左側サイドバー（メニュー） -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="icon" style="font-size: 1.5rem;">🍶</span>
        <h1 class="brand-title">Sella</h1>
      </div>
      
      <nav class="side-nav">
        <button class="nav-item active" data-view="logList">
          <span class="icon">📊</span><span class="label">Dashboard</span>
        </button>
        <button class="nav-item" data-view="batchImport">
          <span class="icon">📦</span><span class="label">一括インポート</span>
        </button>
        <button class="nav-item" data-view="analytics">
          <span class="icon">📈</span><span class="label">Analytics</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="icon">⚙️</span><span class="label">Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <!-- ⛶ 全画面表示ボタン（main.jsのトグル制御と連動） -->
        <button id="btn-fullscreen" class="icon-btn-text" title="全画面切替">
          <span class="icon">⛶</span><span class="label">全画面表示</span>
        </button>
        
        <!-- 🌟 Googleログイン情報とリアルタイム連動するユーザープロフィール -->
        <div class="user-profile" id="sidebar-user-profile" style="cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 8px; transition: background 0.2s;">
          <div class="avatar" id="sidebar-avatar" style="width: 32px; height: 32px; border-radius: 50%; background-color: var(--accent-color); color: #000; display: grid; place-items: center; font-weight: bold; overflow: hidden; flex-shrink: 0;">
            <span id="sidebar-avatar-text">G</span>
          </div>
          <div style="display: flex; flex-direction: column; min-width: 0; text-align: left;">
            <span class="user-name" id="sidebar-username" style="font-size: 0.9rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; color: var(--text-main);">未ログイン</span>
            <span id="sidebar-user-status" style="font-size: 0.7rem; color: var(--text-sub); white-space: nowrap;">タップしてログイン</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- メインコンテンツラッパー -->
    <div class="main-wrapper">
      <header class="mobile-header">
        <button id="btn-menu-toggle" class="icon-btn">☰</button>
        <h2 class="mobile-title">Sella</h2>
        <div style="display: flex; gap: 8px;">
          <button class="icon-btn" data-view="batchImport" title="一括インポート">📦</button>
          <button class="icon-btn" data-view="settings" title="設定">⚙️</button>
        </div>
      </header>

      <!-- SPA ビュー描画領域 -->
      <main id="app" class="app-main">
        <!-- JSでここに画面が動的生成されます -->
      </main>
    </div>

    <!-- 右側ウィジェットパネル（PC用） -->
    <aside class="right-panel">
      <div class="widget-card ai-widget">
        <div class="widget-header">
          <span class="icon">🧠</span>
          <h3>ASK SELLA AI</h3>
        </div>
        <div class="ai-chat-body">
          <div class="chat-bubble ai">何かお酒の記録や検索でお手伝いしましょうか？</div>
        </div>
        <div class="chat-input-wrapper">
          <input type="text" placeholder="AIに質問・検索..." />
          <button class="send-btn">➔</button>
        </div>
      </div>

      <div class="widget-card plugin-widget">
        <div class="widget-header">
          <h3>QUICK ACTIONS</h3>
        </div>
        <div class="plugin-list">
          <button class="plugin-btn" data-view="batchImport">
            <span class="icon">📷</span>
            <div class="btn-text">
              <strong>一括画像解析</strong>
              <small>複数ボトルを自動識別</small>
            </div>
          </button>
        </div>
      </div>
    </aside>

    <!-- フローティングアクションボタン (FAB) -->
    <button id="fab-add" class="fab-btn" data-view="logEditor" title="酒ログを追加">＋</button>

  </div>

  <!-- アプリケーションエントリーJavaScript -->
  <script type="module" src="src/main.js"></script>

</body>
</html>
