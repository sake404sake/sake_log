<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍶 Sella - お酒ログ管理 & アルバム (v22 - Full Edit & Easy API Key)</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #0d0d0e;
            --panel-bg: #141416;
            --card-bg: #1c1c1e;
            --card-hover: #252528;
            --border-color: #2a2a2d;
            --input-bg: #1c1c1e;
            --input-border: #3a3a3d;
            --text-primary: #f5f5f7;
            --text-secondary: #8e8e93;
            --accent-amber: #ffb300;
            --accent-gold: #d4af37;
            --accent-gold-hover: #bfa030;
            --danger-color: #ff453a;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
            --border-radius-lg: 12px;
            --border-radius-md: 8px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        [data-theme="wa-modern"] {
            --bg-color: #f7f5f0;
            --panel-bg: #ffffff;
            --card-bg: #faf9f6;
            --card-hover: #f0ede4;
            --border-color: #e0dacb;
            --input-bg: #ffffff;
            --input-border: #cbd0c4;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --accent-amber: #e74c3c;
            --accent-gold: #16a085;
            --accent-gold-hover: #117a65;
            --danger-color: #c0392b;
            --shadow: 0 4px 12px rgba(44, 62, 80, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-primary); transition: var(--transition); overflow: hidden; height: 100vh; display: flex; }
        .app-container { display: flex; width: 100%; height: 100vh; position: relative; }
        .sidebar { width: 240px; background-color: var(--panel-bg); border-right: 1px solid var(--border-color); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; z-index: 100; }
        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .logo-icon { font-size: 24px; color: var(--accent-gold); }
        .logo-text { font-size: 22px; font-weight: 700; letter-spacing: 2px; color: var(--accent-gold); text-transform: uppercase; }
        .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-secondary); text-decoration: none; border-radius: var(--border-radius-md); cursor: pointer; transition: var(--transition); font-weight: 500; }
        .nav-item:hover, .nav-item.active { color: var(--text-primary); background-color: var(--card-bg); border-left: 3px solid var(--accent-amber); }
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; padding: 24px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header-title { font-size: 24px; font-weight: 600; }
        .search-container { margin-bottom: 20px; position: relative; }
        .search-input { width: 100%; background-color: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px 16px 12px 40px; border-radius: var(--border-radius-lg); font-size: 14px; box-shadow: var(--shadow); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 16px; }
        .view-panel { display: none; }
        .view-panel.active { display: block; }
        .right-sidebar { width: 320px; background-color: var(--panel-bg); border-left: 1px solid var(--border-color); padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius-lg); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 600; color: var(--accent-gold); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .brewery-accordion { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius-lg); margin-bottom: 14px; overflow: hidden; }
        .brewery-header { background-color: var(--card-bg); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .brewery-header:hover { background-color: var(--card-hover); }
        .brewery-title-container { display: flex; align-items: center; gap: 10px; }
        .brewery-name { font-weight: 600; font-size: 15px; }
        .brewery-count-badge { font-size: 11px; background-color: rgba(212, 175, 55, 0.15); color: var(--accent-gold); padding: 2px 8px; border-radius: 12px; }
        .brewery-toggle-icon { font-size: 12px; color: var(--text-secondary); transition: transform 0.3s ease; }
        .brewery-accordion.open .brewery-toggle-icon { transform: rotate(180deg); }
        .brewery-content { display: none; padding: 12px; border-top: 1px solid var(--border-color); background-color: rgba(0,0,0,0.1); }
        .brewery-accordion.open .brewery-content { display: flex; flex-direction: column; gap: 8px; }
        .brand-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 12px 16px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: var(--transition); }
        .brand-card:hover { background-color: var(--card-hover); border-color: var(--accent-amber); transform: translateX(4px); }
        .brand-image-preview { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background-color: #000; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .brand-info { flex: 1; }
        .brand-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .brand-meta { font-size: 11px; color: var(--text-secondary); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-content { background-color: var(--panel-bg); border: 1px solid var(--border-color); width: 100%; max-width: 560px; border-radius: var(--border-radius-lg); box-shadow: var(--shadow); overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background-color: var(--card-bg); }
        .modal-title { font-size: 18px; font-weight: 600; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }
        .close-btn { background: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; border: none; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        
        /* スワイプ対応スライダーギャラリー */
        .slider-container { position: relative; width: 100%; height: 260px; background: #000; border-radius: 8px; overflow: hidden; user-select: none; touch-action: pan-y; }
        .slider-wrapper { display: flex; height: 100%; transition: transform 0.3s ease-out; }
        .slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .slider-btn.prev { left: 10px; }
        .slider-btn.next { right: 10px; }
        .slider-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; z-index: 10; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
        .dot.active { background: var(--accent-gold); transform: scale(1.2); }

        .form-image-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 12px; margin-top: 10px; }
        .form-image-thumb-wrapper { position: relative; aspect-ratio: 1; border: 2px solid var(--border-color); border-radius: var(--border-radius-md); overflow: hidden; background-color: #000; }
        .form-image-thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .form-image-delete-btn { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background-color: var(--danger-color); color: #fff; border: none; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; }
        input, textarea, select { width: 100%; background-color: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-primary); padding: 10px 12px; border-radius: var(--border-radius-md); font-size: 14px; }
        .row-group { display: flex; gap: 12px; }
        .row-group .form-group { flex: 1; }
        button { background-color: var(--accent-gold); color: #000; border: none; padding: 12px 20px; font-weight: 600; font-size: 14px; border-radius: var(--border-radius-md); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover { background-color: var(--accent-gold-hover); }
        button.secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
        button.danger { background-color: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); }
        
        .user-profile-badge { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }

        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background-color: var(--panel-bg); border-top: 1px solid var(--border-color); z-index: 999; justify-content: space-around; align-items: center; }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 10px; cursor: pointer; width: 25%; height: 100%; }
        .bottom-nav-item.active { color: var(--accent-amber); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .app-container { flex-direction: column; height: calc(100vh - 60px); }
            .sidebar { display: none; }
            .main-content { width: 100%; height: 100%; padding: 16px; padding-bottom: 80px; }
            .bottom-nav { display: flex; }
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- 左カラム：PC用サイドバー -->
        <div class="sidebar">
            <div>
                <div class="logo-area">
                    <span class="logo-icon">🍶</span>
                    <span class="logo-text">Sella</span>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item active" onclick="switchView('dashboard')"><span>📊</span> Dashboard</li>
                    <li class="nav-item" onclick="switchView('settings')"><span>⚙️</span> Setting</li>
                </ul>
            </div>
            <div style="font-size: 11px; color: var(--text-secondary); text-align: center;">Sella Base v22.0</div>
        </div>

        <!-- 中央カラム：メインコンテンツ -->
        <div class="main-content">
            <div class="header-bar">
                <h1 class="header-title" id="page-title">ダッシュボード</h1>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 20px; font-size: 12px;">
                        計: <span id="log-count" style="color: var(--accent-amber); font-weight: bold;">0</span> 杯
                    </span>
                    <button onclick="openFormModal('add')" style="padding: 6px 14px; font-size: 13px;">➕ 記録を登録</button>
                </div>
            </div>

            <!-- 検索バー -->
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="search-input" placeholder="銘柄、酒蔵、都道府県、タグ(#...)から検索..." oninput="filterLogs()">
            </div>

            <!-- ビューパネル1：お酒棚 -->
            <div id="view-dashboard" class="view-panel active">
                <div id="log-accordion-container"></div>
            </div>

            <!-- ビューパネル2：設定＆アカウント＆AI -->
            <div id="view-settings" class="view-panel">
                <!-- 🌐 Googleアカウント連携 -->
                <div class="card">
                    <div class="card-title"><span>🌐</span> Google アカウント連携</div>
                    <div id="google-auth-status" style="margin-bottom: 14px;">
                        <span style="font-size: 12px; color: var(--text-secondary);">未ログイン（ローカル保存動作中）</span>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <button id="btn-google-login" onclick="initiateGoogleLogin()" style="background-color: #4285F4; color: white;">
                            Googleアカウントでログイン
                        </button>
                        <button id="btn-google-logout" class="danger" onclick="executeGoogleLogout()" style="display: none;">
                            🚪 ログアウト
                        </button>
                    </div>
                </div>

                <!-- 🤖 Gemini API Key & モデル取得 -->
                <div class="card">
                    <div class="card-title"><span>🤖</span> Gemini AI 設定</div>
                    <div class="form-group">
                        <label style="display:flex; justify-space-between; align-items:center;">
                            <span>Gemini API Key</span>
                            <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" style="color:var(--accent-gold); font-size:11px; text-decoration:none;">🔑 APIキーを取得</a>
                        </label>
                        <div style="display:flex; gap:8px;">
                            <input type="password" id="setting-gemini-key" placeholder="AI StudioのAPI Keyを入力" onchange="saveGeminiKey(this.value)">
                            <button type="button" class="secondary" onclick="copyGeminiKey()" style="padding:6px 12px; font-size:12px; white-space:nowrap;">📋 コピー</button>
                            <button type="button" class="secondary" onclick="pasteGeminiKey()" style="padding:6px 12px; font-size:12px; white-space:nowrap;">📥 貼り付け</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="display:flex; justify-space-between; align-items:center;">
                            <span>使用するモデル</span>
                            <a href="javascript:void(0)" onclick="fetchGeminiModels()" style="color:var(--accent-gold); font-size:11px; text-decoration:none;">🔄 利用可能なモデル一覧を取得</a>
                        </label>
                        <select id="setting-gemini-model" onchange="saveGeminiModel(this.value)">
                            <option value="gemini-2.5-flash">gemini-2.5-flash (標準)</option>
                            <option value="gemini-2.5-pro">gemini-2.5-pro (高精度)</option>
                            <option value="gemini-2.0-flash">gemini-2.0-flash (高速)</option>
                        </select>
                    </div>
                </div>

                <!-- 🔄 過去ログのAI一括再解析機能 -->
                <div class="card">
                    <div class="card-title"><span>🔄</span> 過去ログのAI再解析</div>
                    <p style="font-size:12px; color:var(--text-secondary); margin-bottom:12px; line-height:1.5;">
                        画像が登録されている過去のログをAIで自動解析し、未入力の銘柄名・酒蔵・特定名称・産地・メモなどを一括補完します。
                    </p>
                    <button id="btn-batch-ai" onclick="batchAnalyzePastLogs()" style="width: 100%; background: linear-gradient(135deg, var(--accent-gold), var(--accent-amber)); color:#000;">
                        ✨ 画像付き過去ログを一括AI解析
                    </button>
                </div>

                <!-- 💾 データ管理 -->
                <div class="card">
                    <div class="card-title"><span>💾</span> バックアップ & 復元</div>
                    <button onclick="exportJSON()" style="width: 100%; margin-bottom: 10px;">📤 JSON出力</button>
                    <textarea id="import-text" rows="2" placeholder="JSONを貼り付け" style="margin-bottom: 10px;"></textarea>
                    <button class="secondary" onclick="importJSON()" style="width: 100%;">📥 インポート</button>
                </div>
            </div>
        </div>

        <!-- 下部：スマホナビ -->
        <div class="bottom-nav">
            <div class="bottom-nav-item active" onclick="switchView('dashboard')"><span>📊</span><span>Dashboard</span></div>
            <div class="bottom-nav-item" onclick="openFormModal('add')"><span>➕</span><span>記録する</span></div>
            <div class="bottom-nav-item" onclick="switchView('settings')"><span>⚙️</span><span>Setting</span></div>
        </div>
    </div>

    <!-- モーダル1：記録登録＆編集フォーム -->
    <div class="modal-overlay" id="form-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="form-modal-title"><span>✍️</span> お酒のログ入力</div>
                <input type="hidden" id="edit-log-id" value="">
                <button class="close-btn" onclick="closeFormModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>写真</label>
                    <input type="file" id="image-file-input" accept="image/*" multiple style="display:none;" onchange="processMultipleImages(this)">
                    <div style="display: flex; gap: 10px;">
                        <button type="button" class="secondary" style="flex:1;" onclick="document.getElementById('image-file-input').click()">📂 画像を選択</button>
                        <button type="button" id="btn-ai-analyze" style="flex:1; background: linear-gradient(135deg, var(--accent-gold), var(--accent-amber)); color:#000;" onclick="analyzeImageWithGemini()">✨ AIラベル自動入力</button>
                    </div>
                    <div id="form-image-list-container" class="form-image-container"></div>
                </div>

                <div class="row-group">
                    <div class="form-group"><label>銘柄・名称</label><input type="text" id="drink-name" required></div>
                    <div class="form-group" style="flex: 0.6;">
                        <label>種類</label>
                        <select id="drink-type">
                            <option value="sake">🍶 日本酒</option>
                            <option value="wine">🍷 ワイン</option>
                            <option value="whisky">🥃 ウイスキー</option>
                            <option value="beer">🍺 ビール</option>
                        </select>
                    </div>
                </div>

                <div class="row-group">
                    <div class="form-group"><label>特定名称 / 詳細</label><input type="text" id="drink-subtype" placeholder="例：純米大吟醸"></div>
                    <div class="form-group"><label>酒蔵 / メーカー</label><input type="text" id="drink-brewery" placeholder="例：旭酒造"></div>
                </div>

                <div class="row-group">
                    <div class="form-group"><label>産地 / 都道府県</label><input type="text" id="drink-region" placeholder="例：山口県"></div>
                    <div class="form-group"><label>評価 (1-5)</label><input type="number" id="drink-rating" min="1" max="5" step="0.1" value="4.0"></div>
                </div>

                <div class="form-group"><label>飲んだ日</label><input type="date" id="drink-date"></div>
                <div class="form-group"><label>メモ / 感想</label><textarea id="drink-memo" rows="3"></textarea></div>

                <button onclick="saveLog()" style="width: 100%;">💾 ログを保存</button>
            </div>
        </div>
    </div>

    <!-- モーダル2：お酒の詳細画面（スワイプギャラリー＆基本情報編集対応） -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="detail-title-header">お酒の詳細</div>
                <button class="close-btn" onclick="closeDetailModal()">×</button>
            </div>
            <div class="modal-body">
                <!-- スワイプギャラリー -->
                <div id="detail-gallery-wrapper" style="margin-bottom: 16px; display:none;">
                    <div class="slider-container" id="slider-container">
                        <button class="slider-btn prev" onclick="moveSlide(-1)">❮</button>
                        <div class="slider-wrapper" id="slider-wrapper"></div>
                        <button class="slider-btn next" onclick="moveSlide(1)">❯</button>
                        <div class="slider-dots" id="slider-dots"></div>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
                    <div>
                        <h2 id="detail-name" style="font-size: 22px; color:var(--accent-gold);"></h2>
                        <p id="detail-brewery-info" style="font-size: 13px; color: var(--text-secondary);"></p>
                    </div>
                    <button class="secondary" onclick="triggerEditBrandSpec()" style="padding: 6px 12px; font-size: 11px;">📝 全体情報の括編集</button>
                </div>

                <div class="card" style="padding:14px; margin-bottom: 16px;">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; font-size:13px;">
                        <div>特定名称: <strong id="detail-spec-subtype">-</strong></div>
                        <div>評価: <strong id="detail-spec-rating" style="color:var(--accent-amber);">-</strong></div>
                    </div>
                </div>

                <!-- タイムライン -->
                <div class="card" style="padding:14px;">
                    <div style="font-weight:bold; color:var(--accent-gold); margin-bottom:10px;">🔁 飲酒履歴</div>
                    <div id="detail-timeline-list" style="display:flex; flex-direction:column; gap:8px;"></div>
                </div>

                <button class="danger" onclick="deleteEntireBrand()" style="width:100%; margin-top:16px;">🚨 全履歴削除</button>
            </div>
        </div>
    </div>

    <!-- モーダル3：基本情報一括編集モーダル -->
    <div class="modal-overlay" id="edit-spec-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">📝 基本情報の一括編集</div>
                <button class="close-btn" onclick="closeEditSpecModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label>銘柄・名称</label><input type="text" id="edit-spec-name"></div>
                <div class="form-group"><label>酒蔵 / メーカー</label><input type="text" id="edit-spec-brewery"></div>
                <div class="form-group"><label>特定名称 / 詳細</label><input type="text" id="edit-spec-subtype"></div>
                <div class="form-group"><label>産地 / 都道府県</label><input type="text" id="edit-spec-region"></div>
                <button onclick="saveBrandSpec()" style="width: 100%;">💾 一括更新して保存</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = "649730178066-ahldbjk9r9sn434u5hsgc9uhj96sllkv.apps.googleusercontent.com";
        let tempUploadedImages = [];
        let currentSlideIndex = 0;
        let slideImages = [];
        let currentBrandKey = { name: '', brewery: '' };

        window.onload = function() {
            loadSettings();
            renderLogs();
            initSwipeEvents();
        };

        function getLogs() {
            return JSON.parse(localStorage.getItem('sella_logs') || '[]');
        }

        function saveLogsToStorage(logs) {
            localStorage.setItem('sella_logs', JSON.stringify(logs));
        }

        function loadSettings() {
            const key = localStorage.getItem('sella_gemini_key') || '';
            const model = localStorage.getItem('sella_gemini_model') || 'gemini-2.5-flash';
            document.getElementById('setting-gemini-key').value = key;
            document.getElementById('setting-gemini-model').value = model;

            const userInfo = JSON.parse(localStorage.getItem('sella_google_user') || 'null');
            if (userInfo) displayGoogleUser(userInfo);
        }

        function saveGeminiKey(val) { localStorage.setItem('sella_gemini_key', val); }
        function saveGeminiModel(val) { localStorage.setItem('sella_gemini_model', val); }

        /* APIキー ワンボタンコピー & 貼り付け機能 */
        function copyGeminiKey() {
            const key = document.getElementById('setting-gemini-key').value;
            if (!key) return alert("コピーするAPI Keyが入力されていません。");
            navigator.clipboard.writeText(key).then(() => {
                alert("📋 API Keyをクリップボードにコピーしました！");
            }).catch(() => {
                alert("コピーに失敗しました。");
            });
        }

        async function pasteGeminiKey() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('setting-gemini-key').value = text.trim();
                    saveGeminiKey(text.trim());
                    alert("📥 クリップボードからAPI Keyを貼り付けました！");
                } else {
                    alert("クリップボードが空です。");
                }
            } catch (err) {
                alert("クリップボードの読み取り権限がありません。手動で貼り付けてください。");
            }
        }

        /* Google OAuth & アカウント情報表示 */
        function initiateGoogleLogin() {
            if (!window.google) return alert("Google認証ライブラリ読み込み中...");
            const client = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
                callback: (res) => {
                    if (res.access_token) {
                        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { Authorization: `Bearer ${res.access_token}` }
                        })
                        .then(r => r.json())
                        .then(user => {
                            localStorage.setItem('sella_google_user', JSON.stringify(user));
                            displayGoogleUser(user);
                        });
                    }
                }
            });
            client.requestAccessToken();
        }

        function displayGoogleUser(user) {
            const statusDiv = document.getElementById('google-auth-status');
            statusDiv.innerHTML = `
                <div class="user-profile-badge">
                    <img src="${user.picture}" class="user-avatar">
                    <div>
                        <div style="font-weight:bold; font-size:13px;">${user.name}</div>
                        <div style="font-size:11px; color:var(--text-secondary);">${user.email}</div>
                    </div>
                </div>
            `;
            document.getElementById('btn-google-login').style.display = 'none';
            document.getElementById('btn-google-logout').style.display = 'block';
        }

        function executeGoogleLogout() {
            localStorage.removeItem('sella_google_user');
            document.getElementById('google-auth-status').innerHTML = '<span style="font-size: 12px; color: var(--text-secondary);">未ログイン（ローカル保存動作中）</span>';
            document.getElementById('btn-google-login').style.display = 'block';
            document.getElementById('btn-google-logout').style.display = 'none';
        }

        /* Gemini 利用可能モデルの動的取得 */
        async function fetchGeminiModels() {
            const key = localStorage.getItem('sella_gemini_key');
            if (!key) return alert("先にGemini API Keyを入力してください。");

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await res.json();
                if (data.models) {
                    const select = document.getElementById('setting-gemini-model');
                    select.innerHTML = '';
                    data.models
                        .filter(m => m.name.includes('gemini'))
                        .forEach(m => {
                            const modelId = m.name.replace('models/', '');
                            const opt = document.createElement('option');
                            opt.value = modelId;
                            opt.innerText = `${modelId} (${m.displayName || ''})`;
                            select.appendChild(opt);
                        });
                    alert("モデル一覧を取得・更新しました！");
                }
            } catch (e) {
                alert("モデル一覧の取得に失敗しました。API Keyを確認してください。");
            }
        }

        /* AI画像解析＆自動入力 */
        async function analyzeImageWithGemini() {
            const key = localStorage.getItem('sella_gemini_key');
            if (!key) return alert("設定画面でGemini API Keyを登録してください。");
            if (tempUploadedImages.length === 0) return alert("解析する画像を1枚以上選択してください。");

            const model = localStorage.getItem('sella_gemini_model') || 'gemini-2.5-flash';
            const base64Data = tempUploadedImages[0].split(',')[1];

            const btn = document.getElementById('btn-ai-analyze');
            btn.innerText = "⌛ AI解析中...";
            btn.disabled = true;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "このお酒のラベル画像を解析し、以下の項目をJSON形式で返してください。不明な項目は空文字にしてください。キー名: name(銘柄名), brewery(酒蔵・メーカー名), subtype(特定名称・種類), region(都道府県・産地), memo(味わいや特徴の簡潔な解説)" },
                                { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                            ]
                        }]
                    })
                });
                const data = await res.json();
                const text = data.candidates[0].content.parts[0].text;
                const jsonMatch = text.match(/\{[\s\S]*\}/);
                
                if (jsonMatch) {
                    const result = JSON.parse(jsonMatch[0]);
                    if (result.name) document.getElementById('drink-name').value = result.name;
                    if (result.brewery) document.getElementById('drink-brewery').value = result.brewery;
                    if (result.subtype) document.getElementById('drink-subtype').value = result.subtype;
                    if (result.region) document.getElementById('drink-region').value = result.region;
                    if (result.memo) document.getElementById('drink-memo').value = result.memo;
                    alert("✨ AIによる自動入力が完了しました！");
                }
            } catch (e) {
                alert("AI解析に失敗しました。画像の鮮明さやAPI Keyを確認してください。");
            } finally {
                btn.innerText = "✨ AIラベル自動入力";
                btn.disabled = false;
            }
        }

        /* 過去ログの一括AI解析処理 */
        async function batchAnalyzePastLogs() {
            const key = localStorage.getItem('sella_gemini_key');
            if (!key) return alert("設定画面でGemini API Keyを登録してください。");

            const logs = getLogs();
            const targetIndices = [];
            logs.forEach((log, index) => {
                if (log.images && log.images.length > 0) {
                    targetIndices.push(index);
                }
            });

            if (targetIndices.length === 0) {
                return alert("解析可能な画像付きログが見つかりませんでした。");
            }

            if (!confirm(`画像付きのログ ${targetIndices.length} 件をAIで一括解析しますか？\n（解析結果により既存のデータが補完・更新されます）`)) {
                return;
            }

            const btn = document.getElementById('btn-batch-ai');
            const originalBtnText = btn.innerText;
            btn.disabled = true;

            const model = localStorage.getItem('sella_gemini_model') || 'gemini-2.5-flash';
            let updatedCount = 0;

            for (let i = 0; i < targetIndices.length; i++) {
                const idx = targetIndices[i];
                const log = logs[idx];
                btn.innerText = `⌛ AI解析中 (${i + 1}/${targetIndices.length})...`;

                try {
                    const base64Data = log.images[0].split(',')[1];
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "このお酒のラベル画像を解析し、以下の項目をJSON形式で返してください。不明な項目は空文字にしてください。キー名: name(銘柄名), brewery(酒蔵・メーカー名), subtype(特定名称・種類), region(都道府県・産地), memo(味わいや特徴の簡潔な解説)" },
                                    { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                                ]
                            }]
                        })
                    });

                    const data = await res.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        const jsonMatch = text.match(/\{[\s\S]*\}/);
                        if (jsonMatch) {
                            const result = JSON.parse(jsonMatch[0]);
                            if (result.name) logs[idx].name = result.name;
                            if (result.brewery) logs[idx].brewery = result.brewery;
                            if (result.subtype) logs[idx].subtype = result.subtype;
                            if (result.region) logs[idx].region = result.region;
                            if (result.memo && !logs[idx].memo) logs[idx].memo = result.memo;
                            updatedCount++;
                        }
                    }
                } catch (e) {
                    console.error(`Log ID ${log.id} の解析に失敗しました:`, e);
                }
            }

            saveLogsToStorage(logs);
            renderLogs();
            btn.innerText = originalBtnText;
            btn.disabled = false;
            alert(`処理が完了しました。${updatedCount} 件のログをAIで解析・更新しました！`);
        }

        /* ログ管理 & 表示 */
        function renderLogs() {
            const logs = getLogs();
            document.getElementById('log-count').innerText = logs.length;
            const container = document.getElementById('log-accordion-container');
            container.innerHTML = '';

            const groups = {};
            logs.forEach(log => {
                const b = log.brewery || '不明な蔵元';
                if (!groups[b]) groups[b] = { name: b, brands: {} };
                if (!groups[b].brands[log.name]) groups[b].brands[log.name] = [];
                groups[b].brands[log.name].push(log);
            });

            Object.values(groups).forEach(brewery => {
                const acc = document.createElement('div');
                acc.className = 'brewery-accordion open';
                let contentHTML = '';

                Object.entries(brewery.brands).forEach(([brandName, brandLogs]) => {
                    const latest = brandLogs[0];
                    const img = (brandLogs.find(l => l.images && l.images.length > 0) || {}).images?.[0];
                    const imgTag = img ? `<img src="${img}" class="brand-image-preview">` : `<div class="brand-image-preview">🍶</div>`;

                    contentHTML += `
                        <div class="brand-card" onclick="showLogDetail('${latest.name}', '${latest.brewery}')">
                            ${imgTag}
                            <div class="brand-info">
                                <div class="brand-name">${brandName}</div>
                                <div class="brand-meta">${latest.subtype || '通常'} | ${latest.date}</div>
                            </div>
                            <div style="color:var(--accent-amber); font-weight:bold;">★ ${latest.rating}</div>
                        </div>
                    `;
                });

                acc.innerHTML = `
                    <div class="brewery-header" onclick="this.parentElement.classList.toggle('open')">
                        <div class="brewery-title-container"><span class="brewery-name">🏢 ${brewery.name}</span></div>
                        <span class="brewery-toggle-icon">▼</span>
                    </div>
                    <div class="brewery-content">${contentHTML}</div>
                `;
                container.appendChild(acc);
            });
        }

        /* スワイプギャラリー処理 */
        function showLogDetail(brandName, breweryName) {
            currentBrandKey = { name: brandName, brewery: breweryName };
            const logs = getLogs().filter(l => l.name === brandName && l.brewery === breweryName);
            if (logs.length === 0) {
                closeDetailModal();
                return;
            }
            const latest = logs[0];

            document.getElementById('detail-name').innerText = latest.name;
            document.getElementById('detail-brewery-info').innerText = `🏢 ${latest.brewery} (${latest.region || '産地不明'})`;
            document.getElementById('detail-spec-subtype').innerText = latest.subtype || '通常';
            document.getElementById('detail-spec-rating').innerText = `★ ${latest.rating}`;

            // スライダー画像の初期化
            slideImages = logs.flatMap(l => l.images || []);
            const wrapper = document.getElementById('slider-wrapper');
            const dots = document.getElementById('slider-dots');
            const galleryWrapper = document.getElementById('detail-gallery-wrapper');

            if (slideImages.length > 0) {
                galleryWrapper.style.display = 'block';
                wrapper.innerHTML = slideImages.map(img => `<div class="slide"><img src="${img}"></div>`).join('');
                dots.innerHTML = slideImages.map((_, i) => `<div class="dot ${i===0?'active':''}" onclick="goToSlide(${i})"></div>`).join('');
                currentSlideIndex = 0;
                updateSliderPosition();
            } else {
                galleryWrapper.style.display = 'none';
            }

            // タイムライン（個別のフル編集・AI再解析ボタンを含む）
            const tl = document.getElementById('detail-timeline-list');
            tl.innerHTML = logs.map(l => `
                <div style="background:var(--card-bg); padding:10px 12px; border-left:3px solid var(--accent-amber); border-radius:6px; font-size:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; color:var(--text-secondary); margin-bottom:6px;">
                        <span>📅 ${l.date}</span>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <span style="color:var(--accent-amber); font-weight:bold; margin-right:4px;">★ ${l.rating}</span>
                            <button class="secondary" onclick="openFormModal('edit', '${l.id}')" style="padding:3px 8px; font-size:11px;">✏️ 編集</button>
                            <button class="danger" onclick="deleteSingleLog('${l.id}')" style="padding:3px 8px; font-size:11px;">🗑️</button>
                        </div>
                    </div>
                    <div>${l.memo || 'メモなし'}</div>
                </div>
            `).join('');

            document.getElementById('detail-modal').classList.add('active');
        }

        function updateSliderPosition() {
            const wrapper = document.getElementById('slider-wrapper');
            wrapper.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
            document.querySelectorAll('.dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentSlideIndex);
            });
        }

        function moveSlide(dir) {
            currentSlideIndex = (currentSlideIndex + dir + slideImages.length) % slideImages.length;
            updateSliderPosition();
        }

        function goToSlide(idx) {
            currentSlideIndex = idx;
            updateSliderPosition();
        }

        function initSwipeEvents() {
            const container = document.getElementById('slider-container');
            let startX = 0;
            container.addEventListener('touchstart', e => startX = e.touches[0].clientX, { passive: true });
            container.addEventListener('touchend', e => {
                const diffX = startX - e.changedTouches[0].clientX;
                if (Math.abs(diffX) > 40) moveSlide(diffX > 0 ? 1 : -1);
            }, { passive: true });
        }

        /* 基本情報の一括編集機能 */
        function triggerEditBrandSpec() {
            const logs = getLogs().filter(l => l.name === currentBrandKey.name && l.brewery === currentBrandKey.brewery);
            if (logs.length === 0) return;

            const sample = logs[0];
            document.getElementById('edit-spec-name').value = sample.name;
            document.getElementById('edit-spec-brewery').value = sample.brewery;
            document.getElementById('edit-spec-subtype').value = sample.subtype || '';
            document.getElementById('edit-spec-region').value = sample.region || '';

            document.getElementById('edit-spec-modal').classList.add('active');
        }

        function saveBrandSpec() {
            const newName = document.getElementById('edit-spec-name').value.trim();
            const newBrewery = document.getElementById('edit-spec-brewery').value.trim();
            const newSubtype = document.getElementById('edit-spec-subtype').value.trim();
            const newRegion = document.getElementById('edit-spec-region').value.trim();

            if (!newName) return alert("銘柄名を入力してください");

            let logs = getLogs();
            logs = logs.map(log => {
                if (log.name === currentBrandKey.name && log.brewery === currentBrandKey.brewery) {
                    return { ...log, name: newName, brewery: newBrewery, subtype: newSubtype, region: newRegion };
                }
                return log;
            });

            saveLogsToStorage(logs);
            closeEditSpecModal();
            closeDetailModal();
            renderLogs();
            alert("基本情報を一括更新しました。");
        }

        function deleteEntireBrand() {
            if (!confirm(`「${currentBrandKey.name}」の全履歴を削除しますか？`)) return;
            let logs = getLogs().filter(l => !(l.name === currentBrandKey.name && l.brewery === currentBrandKey.brewery));
            saveLogsToStorage(logs);
            closeDetailModal();
            renderLogs();
        }

        function deleteSingleLog(id) {
            if (!confirm("このログを削除しますか？")) return;
            let logs = getLogs().filter(l => l.id !== id);
            saveLogsToStorage(logs);
            showLogDetail(currentBrandKey.name, currentBrandKey.brewery);
            renderLogs();
        }

        /* 画像アップロード補助 */
        function processMultipleImages(input) {
            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    tempUploadedImages.push(e.target.result);
                    renderFormThumbs();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderFormThumbs() {
            const container = document.getElementById('form-image-list-container');
            container.innerHTML = tempUploadedImages.map((img, i) => `
                <div class="form-image-thumb-wrapper">
                    <img src="${img}">
                    <button class="form-image-delete-btn" onclick="tempUploadedImages.splice(${i},1);renderFormThumbs();">×</button>
                </div>
            `).join('');
        }

        /* 保存 ＆ モーダル制御 (新規登録 & フル過去ログ編集の統合) */
        function saveLog() {
            const name = document.getElementById('drink-name').value.trim();
            if (!name) return alert("銘柄名を入力してください");

            const editId = document.getElementById('edit-log-id').value;
            let logs = getLogs();

            const logData = {
                id: editId || ('log_' + Date.now()),
                name,
                type: document.getElementById('drink-type').value,
                subtype: document.getElementById('drink-subtype').value,
                brewery: document.getElementById('drink-brewery').value,
                region: document.getElementById('drink-region').value,
                rating: document.getElementById('drink-rating').value,
                date: document.getElementById('drink-date').value || new Date().toISOString().split('T')[0],
                memo: document.getElementById('drink-memo').value,
                images: [...tempUploadedImages]
            };

            if (editId) {
                const index = logs.findIndex(l => l.id === editId);
                if (index !== -1) {
                    logs[index] = logData;
                } else {
                    logs.unshift(logData);
                }
            } else {
                logs.unshift(logData);
            }

            saveLogsToStorage(logs);
            closeFormModal();

            if (document.getElementById('detail-modal').classList.contains('active')) {
                showLogDetail(logData.name, logData.brewery);
            }

            renderLogs();
        }

        function openFormModal(mode = 'add', logId = null) {
            tempUploadedImages = [];
            document.getElementById('edit-log-id').value = '';

            if (mode === 'edit' && logId) {
                const logs = getLogs();
                const log = logs.find(l => l.id === logId);
                if (log) {
                    document.getElementById('edit-log-id').value = log.id;
                    document.getElementById('drink-name').value = log.name || '';
                    document.getElementById('drink-type').value = log.type || 'sake';
                    document.getElementById('drink-subtype').value = log.subtype || '';
                    document.getElementById('drink-brewery').value = log.brewery || '';
                    document.getElementById('drink-region').value = log.region || '';
                    document.getElementById('drink-rating').value = log.rating || 4.0;
                    document.getElementById('drink-date').value = log.date || new Date().toISOString().split('T')[0];
                    document.getElementById('drink-memo').value = log.memo || '';
                    tempUploadedImages = log.images ? [...log.images] : [];
                    document.getElementById('form-modal-title').innerHTML = '<span>✏️</span> お酒のログ編集';
                }
            } else {
                document.getElementById('drink-name').value = '';
                document.getElementById('drink-type').value = 'sake';
                document.getElementById('drink-subtype').value = '';
                document.getElementById('drink-brewery').value = '';
                document.getElementById('drink-region').value = '';
                document.getElementById('drink-rating').value = '4.0';
                document.getElementById('drink-date').value = new Date().toISOString().split('T')[0];
                document.getElementById('drink-memo').value = '';
                document.getElementById('form-modal-title').innerHTML = '<span>✍️</span> お酒のログ入力';
            }

            renderFormThumbs();
            document.getElementById('form-modal').classList.add('active');
        }

        function closeFormModal() { document.getElementById('form-modal').classList.remove('active'); }
        function closeDetailModal() { document.getElementById('detail-modal').classList.remove('active'); }
        function closeEditSpecModal() { document.getElementById('edit-spec-modal').classList.remove('active'); }

        function switchView(viewId) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
        }

        function filterLogs() {
            const query = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.brand-card').forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        function exportJSON() {
            navigator.clipboard.writeText(JSON.stringify(getLogs(), null, 2));
            alert("JSONをクリップボードにコピーしました");
        }

        function importJSON() {
            try {
                const logs = JSON.parse(document.getElementById('import-text').value);
                saveLogsToStorage(logs);
                renderLogs();
                alert("復元完了しました");
            } catch (e) { alert("JSONフォーマットが正しくありません"); }
        }
    </script>
</body>
</html>
