<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sella - 酒ログ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="drawer-overlay" class="drawer-overlay"></div>

  <div class="app-container">
    <!-- 1. 左サイドメニュー -->
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-icon">🌙</div>
        <h1 class="brand-title">SELLA</h1>
      </div>

      <nav class="side-nav">
        <button class="nav-item active" data-view="logList">
          <span class="icon">📊</span><span class="label">Dashboard</span>
        </button>
        <button class="nav-item" data-view="batchImport">
          <span class="icon">📦</span><span class="label">一括インポート</span>
        </button>
        <button class="nav-item" data-view="analytics">
          <span class="icon">📈</span><span class="label">Analytics</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="icon">⚙️</span><span class="label">Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button id="btn-fullscreen" class="icon-btn-text" title="全画面切替">
          <span class="icon">⛶</span><span class="label">全画面表示</span>
        </button>
        <div class="user-profile">
          <div class="avatar">S</div>
          <span class="user-name">User</span>
        </div>
      </div>
    </aside>

    <!-- 2. メインコンテンツエリア -->
    <div class="main-wrapper">
      <header class="mobile-header">
        <button id="btn-menu-toggle" class="icon-btn">☰</button>
        <h2 class="mobile-title">Sella</h2>
        <div style="display: flex; gap: 8px;">
          <button class="icon-btn" data-view="batchImport" title="一括インポート">📦</button>
          <button class="icon-btn" data-view="settings" title="設定">⚙️</button>
        </div>
      </header>

      <main id="app" class="app-main">
        <!-- JSで画面切り替え -->
      </main>
    </div>

    <!-- 3. 右ウィジェットパネル -->
    <aside class="right-panel">
      <div class="widget-card ai-widget">
        <div class="widget-header">
          <span class="icon">🧠</span>
          <h3>ASK SELLA AI</h3>
        </div>
        <div class="ai-chat-body">
          <div class="chat-bubble ai">何かお酒の記録や検索でお手伝いしましょうか？</div>
        </div>
        <div class="chat-input-wrapper">
          <input type="text" placeholder="AIに質問・検索..." />
          <button class="send-btn">➔</button>
        </div>
      </div>

      <div class="widget-card plugin-widget">
        <div class="widget-header">
          <h3>QUICK ACTIONS</h3>
        </div>
        <div class="plugin-list">
          <button class="plugin-btn" data-view="batchImport">
            <span class="icon">📷</span>
            <div class="btn-text">
              <strong>一括画像解析</strong>
              <small>複数ボトルを自動識別</small>
            </div>
          </button>
        </div>
      </div>
    </aside>
  </div>

  <button id="fab-add" class="fab-btn" data-view="logEditor" title="酒ログを追加">＋</button>

  <!-- 設定用モーダル（APIキー・モデル選択） -->
  <div id="settings-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 500px;">
      <div class="modal-header">
        <h3>⚙️ Gemini API 設定</h3>
        <button id="btn-close-settings" class="modal-close-btn">✕</button>
      </div>
      <div class="modal-body" style="grid-template-columns: 1fr; gap: 16px;">
        <div class="form-group">
          <label for="input-api-key">Gemini API Key</label>
          <div class="input-group">
            <input type="password" id="input-api-key" class="input-dark" placeholder="AIzaSy..." />
            <button type="button" id="btn-save-api-key" class="btn-primary">保存</button>
          </div>
        </div>

        <div class="form-group">
          <label for="select-gemini-model">使用するAIモデル</label>
          <div class="input-group">
            <select id="select-gemini-model" class="input-dark">
              <option value="">APIキーを入力してください</option>
            </select>
            <button type="button" id="btn-reload-models" class="btn-secondary">再取得</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
